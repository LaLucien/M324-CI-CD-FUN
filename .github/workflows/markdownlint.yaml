name: Markdown Lint

on:
  push:
    # Defining Paths here wouldn't be necessary as the action would run on all pushes anyway
    # But with it, it only runs when the files defined below actually change
    # Also included are the workflow file and the markdownlint config file
    # Because we probably want the workflow to run when those files change as well
    paths: 
      - "**/*.md"
      - ".github/workflows/markdownlint.yaml"
      - ".markdownlint.jsonc"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdownlint.yaml"
      - ".markdownlint.jsonc"
  workflow_dispatch:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          config: .markdownlint.jsonc
          # Define which files to lint
          globs: "**/*.md"

